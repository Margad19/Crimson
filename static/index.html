<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f12;
      --surface:  #13161a;
      --border:   #1e2328;
      --border2:  #2a3040;
      --text:     #e8eaf0;
      --muted:    #5a6278;
      --accent:   #4f7cff;
      --accent2:  #3a5fd4;
      --error:    #ff5f5f;
      --success:  #39d98a;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Sans', sans-serif;
      overflow: hidden;
    }

    /* grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* glow behind card */
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79,124,255,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 2.5rem 2.5rem 2rem;
      z-index: 1;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: 2rem; right: 2rem;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 0 0 2px 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 32px; height: 32px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
    }

    .brand-icon svg {
      width: 16px; height: 16px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .brand-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-top: 1px;
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .flash-error {
      background: rgba(255,95,95,0.08);
      border: 1px solid rgba(255,95,95,0.25);
      border-radius: 3px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flash-error svg {
      width: 15px; height: 15px;
      stroke: var(--error);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      pointer-events: none;
      transition: stroke 0.2s;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: 10px 12px 10px 38px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,124,255,0.12);
    }

    input[type="text"]:focus + svg,
    input[type="password"]:focus + svg {
      stroke: var(--accent);
    }

    /* put icon before input in DOM, use sibling selector above */
    .input-wrap input { order: 1; }
    .input-wrap svg  { order: 2; }

    /* rearrange so icon is visually left */
    .input-wrap { display: flex; flex-direction: row; align-items: center; }
    .input-wrap input { flex: 1; }
    .input-wrap svg {
      position: absolute;
      left: 12px;
      order: 0;
    }

    .toggle-pw {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; padding: 4px;
      display: flex; align-items: center;
    }

    .toggle-pw svg {
      position: static; transform: none;
      width: 15px; height: 15px;
      stroke: var(--muted);
      fill: none; stroke-width: 2;
      transition: stroke 0.2s;
    }

    .toggle-pw:hover svg { stroke: var(--text); }

    .pw-wrap input { padding-right: 36px; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    button[type="submit"]:hover  { background: var(--accent2); }
    button[type="submit"]:active { transform: scale(0.99); }

    button[type="submit"] svg {
      width: 15px; height: 15px;
      stroke: #fff; fill: none;
      stroke-width: 2; stroke-linecap: round;
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
    }

    .tag {
      display: inline-block;
      background: rgba(79,124,255,0.1);
      border: 1px solid rgba(79,124,255,0.2);
      color: var(--accent);
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      padding: 2px 7px;
      border-radius: 2px;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card { animation: fadeUp 0.35s ease both; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 16 16">
        <rect x="2" y="2" width="5" height="5" rx="0.5"/>
        <rect x="9" y="2" width="5" height="5" rx="0.5"/>
        <rect x="2" y="9" width="5" height="5" rx="0.5"/>
        <circle cx="11.5" cy="11.5" r="2.5"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">Attendance</div>
      <div class="brand-sub">Router Automation</div>
    </div>
  </div>

  <div class="tag">SECURE ACCESS</div>

  <h1>Sign in</h1>
  <p class="subtitle">Enter your credentials to continue.</p>

  {% if error %}
  <div class="flash-error">
    <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><line x1="8" y1="5" x2="8" y2="8"/><line x1="8" y1="11" x2="8" y2="11" stroke-linecap="round"/></svg>
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/auth/login">
    <div class="field">
      <label for="username">Username</label>
      <div class="input-wrap">
        <input
          type="text"
          id="username"
          name="username"
          placeholder="your_username"
          value="{{ username or '' }}"
          autocomplete="username"
          required
        />
        <svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="2.5"/><path d="M3 13c0-2.76 2.24-5 5-5s5 2.24 5 5"/></svg>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap pw-wrap">
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
        <svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
        <button type="button" class="toggle-pw" onclick="togglePw(this)" aria-label="Toggle password">
          <svg id="eye-icon" viewBox="0 0 16 16">
            <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/>
            <circle cx="8" cy="8" r="2"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <button type="submit">
      <svg viewBox="0 0 16 16"><path d="M10 8H3m5-3l3 3-3 3"/><path d="M6 3H13v10H6" stroke-linecap="round"/></svg>
      Sign in
    </button>
  </form>

  <p class="footer">Router Automation System &mdash; v1.0</p>
</div>

<script>
  function togglePw(btn) {
    const inp = btn.closest('.pw-wrap').querySelector('input');
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    btn.querySelector('svg').innerHTML = showing
      ? '<path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/>'
      : '<path d="M2 2l12 12M6.5 6.6A3 3 0 0011.4 9.5M4.2 4.3C2.5 5.5 1 8 1 8s2.5 5 7 5c1.4 0 2.7-.4 3.8-1"/>';
  }
</script>

</body>
</html>
