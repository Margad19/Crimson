<!-- static/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 16 16">
          <rect x="2" y="2" width="5" height="5" rx="0.5"/>
          <rect x="9" y="2" width="5" height="5" rx="0.5"/>
          <rect x="2" y="9" width="5" height="5" rx="0.5"/>
          <circle cx="11.5" cy="11.5" r="2.5"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Attendance</div>
        <div class="brand-sub">Router Automation</div>
      </div>
    </div>

    <div class="tag">SECURE ACCESS</div>

    <h1>Sign in</h1>
    <p class="subtitle">Enter your credentials to continue.</p>

    <form onsubmit="handleLogin(event)">

    <form method="POST" action="/auth/login">
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="your_username"
            autocomplete="username"
            required
          />
          <svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="2.5"/><path d="M3 13c0-2.76 2.24-5 5-5s5 2.24 5 5"/></svg>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap pw-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
          <button type="button" class="toggle-pw" onclick="togglePw(this)" aria-label="Toggle password">
            <svg id="eye-icon" viewBox="0 0 16 16">
              <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/>
              <circle cx="8" cy="8" r="2"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="divider"></div>

      <button type="submit">
        <svg viewBox="0 0 16 16"><path d="M10 8H3m5-3l3 3-3 3"/><path d="M6 3H13v10H6" stroke-linecap="round"/></svg>
        Sign in
      </button>
    </form>

    <p class="footer">Router Automation System &mdash; v1.0</p>
  </div>
  <script src="./js/login.js"></script>
</body>
</html>
